# Database-Driven LLM Wiki — local infrastructure (Phase 0).
# Brings up Oracle Free (23ai, includes VECTOR + Oracle Text) and Ollama for embeddings.
#
#   cd docker && docker compose up -d
#   docker compose exec ollama ollama pull nomic-embed-text   # one-time model pull
#
# Reads secrets from ../env/.env (gitignored). Copy ../env/.env.example first.

name: llm-wiki

services:
  oracle:
    # Oracle Database 23ai Free — ships VECTOR datatype + Oracle Text (used from Phase 4).
    image: container-registry.oracle.com/database/free:latest
    container_name: llmwiki-oracle
    ports:
      - "1521:1521"
    environment:
      # ORACLE_PWD is the SYS/SYSTEM/PDBADMIN password — supplied via env, never hard-coded.
      ORACLE_PWD: ${ORACLE_PWD:?ORACLE_PWD must be set in env/.env}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Scripts in this dir run ONCE, on first database creation (alphabetical order).
      - ./oracle:/opt/oracle/scripts/startup:ro
    healthcheck:
      # Listener is up and the DB is open once this succeeds.
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/${ORACLE_PWD}@localhost:1521/FREEPDB1 | grep -q '1'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  ollama:
    # Embeddings provider for nomic-embed-text (768-dim). CPU is fine for Phase 0; GPU optional.
    image: ollama/ollama:latest
    container_name: llmwiki-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # --- GPU (optional) ---------------------------------------------------
    # Uncomment to use an NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  oracle-data:
  ollama-models:
